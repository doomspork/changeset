services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: changeset
      POSTGRES_PASSWORD: changeset
      POSTGRES_DB: changeset_test
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U changeset"]
      interval: 2s
      timeout: 2s
      retries: 20
