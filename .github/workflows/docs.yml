name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - examples/**
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - examples/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs from docs/pnpm-lock.yaml, builds, and uploads docs/dist as the Pages artifact.
      - uses: withastro/action@v6
        with:
          path: docs
          node-version: 24

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
